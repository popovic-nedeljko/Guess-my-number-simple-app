<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Guess My Number!</title>
  </head>
  <body>
    <button class="btn again">Again!</button>
    <p class="between">(Between 1 and 25)</p>

    <header>
      <h1>
        <span class="line1">Guess</span>
        <span class="line2">My Number!</span>
      </h1>
      <span class="float-num f1">7</span>
      <span class="float-num f2">12</span>
      <span class="float-num f3">3</span>
      <span class="float-num f4">21</span>
    </header>

    <div class="divider">
      <div class="number">?</div>
    </div>

    <main>
      <section class="left">
        <input type="number" class="guess" min="1" max="25" />
        <button class="btn check">Check!</button>
      </section>

      <section class="right">
        <p class="message">
          <span class="msg-icon">💡</span>
          <span class="msg-text">Start guessing...</span>
        </p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-highscore">🥇 Highscore: <span class="highscore">0</span></p>
      </section>
    </main>

    <div class="new-game-wrap">
      <button class="btn new-game">🔄 New Game</button>
    </div>
  </body>
</html>
